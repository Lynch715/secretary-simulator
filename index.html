<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE">
<title>大秘</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="大秘">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* === main.css === */
/* 《大秘》皮：文件纸底、墨色字、红头红章 */
:root{
  --paper:#F3F2EE; --paper2:#EDEBE4; --ink:#1E1B17; --ink2:#4A443C;
  --ink3:#8A8073; --line:#CFC9BC; --line2:#E2DDD2;
  --red:#9B2A1F; --red2:#C0392B; --redbg:#F6E9E6;
  --gold:#8A6D3B;
  --fs:16px; --song:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --hei:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:var(--hei);font-size:var(--fs);line-height:1.7;
  -webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding:0 14px 96px;min-height:100vh}

/* ── 红头 ───────────────────────────── */
.letterhead{text-align:center;padding:18px 0 6px}
.letterhead h1{margin:0;font-family:var(--song);font-size:30px;font-weight:700;
  color:var(--red);letter-spacing:.32em;text-indent:.32em}
.letterhead .rule{height:0;border-top:2.5px solid var(--red);margin:10px 0 0}
.letterhead .rule2{height:0;border-top:1px solid var(--red);margin:2px 0 0}

/* ── 日期条 ─────────────────────────── */
.datebar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  padding:10px 2px;font-size:14px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.datebar b{font-family:var(--song);font-size:17px;color:var(--ink);font-weight:700}
.datebar .days{color:var(--red);font-weight:600}

/* ── 指标条 ─────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin:12px 0}
.stat{background:var(--paper);padding:8px 6px;text-align:center;position:relative}
.stat .k{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.stat .v{font-family:var(--song);font-size:22px;font-weight:700;line-height:1.2}
.stat .bar{height:3px;background:var(--line2);margin-top:5px}
.stat .bar i{display:block;height:3px;background:var(--ink2)}
.stat.low .v{color:var(--red)}
.stat.low .bar i{background:var(--red)}
.stat .delta{position:absolute;top:4px;right:6px;font-size:12px;font-weight:600;
  opacity:0;transition:opacity .4s}
.stat .delta.on{opacity:1}
.stat .delta.up{color:#2F6B4F}.stat .delta.dn{color:var(--red)}

/* ── 主区 ───────────────────────────── */
.main{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:14px;align-items:start}
.panel{border:1px solid var(--line);background:var(--paper)}
.panel>h3{margin:0;padding:8px 12px;font-family:var(--song);font-size:15px;font-weight:700;
  border-bottom:1px solid var(--line2);background:var(--paper2);letter-spacing:.08em}

/* 待办队列 */
.queue{list-style:none;margin:0;padding:0}
.queue li{border-bottom:1px solid var(--line2)}
.q{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;
  cursor:pointer;position:relative;min-height:44px}
.q:hover{background:var(--paper2)}
.q.sel{background:#EAE6DA}
.q .tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);
  color:var(--ink3);margin-right:6px;vertical-align:1px}
.q .t{font-size:14px}
.q .meta{font-size:12px;color:var(--ink3);margin-top:2px}
.q.due-over{border-left:3px solid var(--red)}
.q.due-over .tag{color:#fff;background:var(--red);border-color:var(--red)}
.q.due-month{border-left:3px solid var(--ink2)}
.q.due-next{border-left:3px solid var(--line)}
.q.due-plan{border-left:3px solid var(--line2);opacity:.66}
.q.done{opacity:.45}
.q.done .t{text-decoration:line-through}
.queue .sep{padding:5px 12px;font-size:12px;color:var(--ink3);background:var(--paper2);
  border-bottom:1px solid var(--line2)}

/* 送阅件 */
.doc{padding:16px 18px 18px}
.doc .no{font-family:var(--song);font-size:13px;color:var(--red);text-align:right;
  border-bottom:1px solid var(--red);padding-bottom:6px;margin-bottom:12px}
.doc h2{margin:0 0 4px;font-family:var(--song);font-size:20px;font-weight:700}
.doc .sub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.doc p{margin:0 0 12px;text-indent:2em;font-family:var(--song);font-size:16px}
.doc .hr{border-top:1px dashed var(--line);margin:14px 0}
.doc .lab{font-size:12px;color:var(--ink3);letter-spacing:.14em;margin-bottom:6px}

/* 拟办意见 */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  padding:10px 12px;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--ink2);background:#EFEDE6}
.opt .t{font-size:15px}
.opt .d{float:right;font-size:12px;color:var(--ink3);margin-left:10px}
.opt .n{font-size:13px;color:var(--ink2);margin-top:3px}
.opt.gray{border-left:3px solid var(--red)}
.opt.gray .rule{font-size:12px;color:var(--red);margin-top:3px}
.opt[disabled]{opacity:.45;cursor:not-allowed}

/* 结果 */
.result{border:1px solid var(--line);background:var(--paper2);padding:12px 14px;margin-top:12px}
.result .r{font-family:var(--song);font-size:16px}
.result .keep{font-size:13px;color:var(--gold);margin-top:6px}

/* ── 页签 ───────────────────────────── */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--line);display:flex;z-index:20;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{max-width:1080px;margin:0 auto;width:100%;display:flex;align-items:stretch}
.tab{flex:1;background:none;border:0;padding:12px 4px;cursor:pointer;font-size:14px;
  color:var(--ink2);min-height:48px;border-right:1px solid var(--line2)}
.tab.on{color:var(--red);font-weight:700;box-shadow:inset 0 -3px 0 var(--red)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);
  vertical-align:3px;margin-left:4px}
.endmo{flex:0 0 auto;background:var(--red);color:#fff;border:0;padding:12px 20px;
  font-weight:700;cursor:pointer;min-height:48px;font-family:var(--song);letter-spacing:.1em}
.endmo[disabled]{background:var(--ink3);cursor:not-allowed}

/* ── 卡片（班子/区县/家里/档案）─────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px}
.card{border:1px solid var(--line);background:var(--paper);padding:10px 12px}
.card .n{font-family:var(--song);font-size:16px;font-weight:700}
.card .p{font-size:12px;color:var(--ink3)}
.card .l{font-size:13px;color:var(--ink2);margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:3px}
.kv i{font-style:normal;color:var(--ink3)}
.mini{height:3px;background:var(--line2);margin-top:2px}
.mini i{display:block;height:3px;background:var(--ink2)}

/* ── 弹窗 ───────────────────────────── */
.mask{position:fixed;inset:0;background:rgba(30,27,23,.42);display:flex;align-items:center;
  justify-content:center;z-index:40;padding:16px}
.modal{background:var(--paper);border:1px solid var(--line);max-width:560px;width:100%;
  max-height:86vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:12px 16px;font-family:var(--song);font-size:18px;
  border-bottom:2px solid var(--red);color:var(--red)}
.modal .body{padding:14px 16px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}
.btn{background:var(--paper);border:1px solid var(--line);padding:9px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.btn.pri:hover{background:var(--red2)}

/* 批示 */
.remark{font-family:var(--song);color:var(--red);font-size:19px;
  border-left:3px solid var(--red);padding:4px 0 4px 12px;margin:8px 0}
.remark .on{font-size:13px;color:var(--ink3);display:block;font-family:var(--hei)}

/* 杂 */
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:14px}
.seal{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--song);
  padding:2px 8px;transform:rotate(-7deg);font-size:13px;letter-spacing:.1em}
.bar-note{font-size:12px;color:var(--ink3);padding:0 2px 8px}

/* ── 手机 ───────────────────────────── */
@media (max-width:760px){
  :root{--fs:15px}
  #app{padding:0 12px 92px}
  .letterhead h1{font-size:22px;letter-spacing:.2em;text-indent:.2em}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat .v{font-size:19px}
  .main{grid-template-columns:1fr;gap:12px}
  .doc{padding:14px}
  .tab{font-size:13px;padding:10px 2px}
  .endmo{padding:10px 12px;font-size:14px}
  .cards{grid-template-columns:1fr}
  .opt .d{float:none;display:block;margin:2px 0 0}
}

/* 没批的批示 */
.remark.none{color:var(--ink3);font-size:15px;border-left-color:var(--line);font-style:normal}
.opt.gray{border-left:3px solid var(--red)}

/* 这些人之间 */
.pair{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:10px;margin-top:13px}
.pn{font-family:var(--song);font-size:15px}
.pn i{font-style:normal;color:var(--ink3);font-size:12px;font-family:var(--hei);margin-left:6px}
.pn.r{text-align:right}
.pline{display:block;height:0}
.pwhy{font-size:12px;color:var(--ink3);text-align:center;padding-bottom:6px;
  border-bottom:1px solid var(--line2)}
.pair.hot .pn{font-weight:700}
.pwhy.hot{color:var(--red)}
@media (max-width:760px){ .pair{grid-template-columns:1fr 46px 1fr} .pn{font-size:14px}
  .pn i{display:block;margin:0} }

/* 卷宗：材料和认定 */
.mats{display:flex;flex-direction:column;gap:6px}
.mat{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  padding:9px 12px;cursor:pointer;min-height:40px;font-family:inherit;font-size:inherit;color:inherit}
.mat:hover{border-color:var(--ink2);background:#EFEDE6}
.mat.on{background:var(--paper2);cursor:default;border-left:3px solid var(--gold)}
.mat .mt{font-size:14px;font-family:var(--song)}
.mat .mf{font-size:12px;color:var(--ink3);float:right;font-family:var(--hei);margin-left:10px}
.mat .mx{font-size:13px;color:var(--ink2);margin-top:5px;clear:both}
.finds{display:flex;flex-wrap:wrap;gap:6px 18px}
.find{font-size:13px;color:var(--ink3)}
.find.on{color:var(--ink);font-weight:600}
@media (max-width:760px){ .mat .mf{float:none;display:block;margin:2px 0 0} }

/* 排人 */
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;
  width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  padding:9px 12px;cursor:pointer;min-height:42px;font-family:inherit;font-size:inherit;color:inherit}
.slot:hover{border-color:var(--ink2)}
.slot.on{background:#EAE6DA;border-color:var(--ink2)}
.slot[disabled]{cursor:default;opacity:.7}
.slot .box{display:inline-block;width:18px;height:18px;border:1px solid var(--ink3);
  text-align:center;line-height:16px;font-size:13px;color:var(--red)}
.slot.on .box{border-color:var(--red)}
.slot .sn{font-family:var(--song);font-size:15px}
.slot .sn i{font-style:normal;font-family:var(--hei);font-size:12px;color:var(--ink3);margin-left:8px}
.slot .sw{font-size:13px;color:var(--ink2)}
@media (max-width:760px){ .slot{grid-template-columns:22px 1fr} .slot .sw{grid-column:2;font-size:12px} }

/* 常委会票面 */
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 16px}
.vote{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px dotted var(--line2);padding:4px 0}
.vn{font-family:var(--song);font-size:14px}
.vn i{font-style:normal;font-family:var(--hei);font-size:11px;color:var(--ink3);margin-left:6px}
.vv{font-size:13px;color:var(--ink3)}
.vv.y{color:#2F6B4F}.vv.n{color:var(--red)}

/* 结局图鉴 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:12px 14px}
.dexi{border:1px solid var(--line);padding:9px 10px;text-align:center;font-size:13px;
  color:var(--ink3);background:var(--paper2);font-family:var(--song)}
.dexi.on{color:var(--red);border-color:var(--red);background:var(--paper);font-weight:700}

/* ── 图。没有就整块不出现 ── */
.artwrap{line-height:0}
.art{display:block;max-width:100%}
.art-banner{width:100%;height:150px;object-fit:cover;border-bottom:1px solid var(--line2);
  filter:saturate(.9)}
.art-face{position:absolute;top:8px;right:8px;width:44px;height:58px;object-fit:cover;
  object-position:top center;border:1px solid var(--line);background:var(--paper)}
.card{position:relative}
.card.has-face{padding-right:60px}
.doc-face{position:absolute;top:44px;right:18px;width:52px;height:68px;z-index:2}
.art-end{width:100%;height:280px;object-fit:cover;border-bottom:2px solid var(--red)}
.art-cover{width:100%;height:160px;object-fit:cover;margin-bottom:12px}
@media (max-width:760px){
  .art-banner{height:110px}
  .art-end{height:180px}
  .art-face{width:38px;height:50px}
  .card.has-face{padding-right:52px}
  .doc-face{display:none}
}

/* ── 装到桌面的小弹窗 ── */
.inst-mask{position:fixed;inset:0;background:rgba(30,28,26,.45);display:flex;
  align-items:center;justify-content:center;z-index:900;padding:20px}
.inst-box{background:#F7F6F3;border:1px solid #C9C4BA;box-shadow:0 8px 28px rgba(0,0,0,.18);
  max-width:360px;width:100%;padding:22px 22px 18px}
.inst-box h3{margin:0 0 10px;font-family:Songti SC,SimSun,serif;font-size:19px;color:#6E1414;
  letter-spacing:.06em}
.inst-box p{margin:0 0 16px;font-size:14px;line-height:1.75;color:#3A3733}
.inst-row{display:flex;gap:10px;justify-content:flex-end}
.inst-row button{min-height:40px;padding:0 18px;font-size:14px;border:1px solid #C9C4BA;
  background:#FDFDFB;color:#3A3733;cursor:pointer}
.inst-row .inst-yes{background:#8C1F1F;border-color:#8C1F1F;color:#F6F3EE}
@media (max-width:760px){ .inst-row{justify-content:stretch} .inst-row button{flex:1} }

</style>
</head>

<script>

"use strict";

var ARCS = [];
var ARCS_BY_ID = {};
function defArc(a){ ARCS.push(a); ARCS_BY_ID[a.id] = a; }

/* === data/arcs_a.js === */
/* ── 主线 A：旧城改造之争。书记要推，市长拖着，两家开发商各押一边 ── */

    next:{ '*':'a2' }, lateNext:'a2',

  { id:'a2', src:'办文', gap:2,

      { id:'a2_m3', t:'信访口径汇总', from:'信访局', d:2,

      { id:'先拆的吃亏', t:'早签字的那批人亏了', need:1 }
    ],
    opts:[
      { t:'把缺口如实写进呈阅件', d:2, tier:'good', reqFind:'钱根本不够',
        n:'书记看完把笔放下了。专题会推迟了一周。市长那天在走廊上对你点了下头',

  return { y: START_Y + Math.floor(i / 12), m: i % 12 + 1 };
}
function ymText(month){
  var t = ymOf(month);
  return t.y + '年' + t.m + '月';
}

/* ── 全局状态 ───────────────────────── */
var G = null;

function newGame(opt){
  opt = opt || {};
  var seed = opt.seed != null ? opt.seed : (Date.now() & 0x7fffffff);
  RNG = mulberry32(seed);
  G = {
    ver: VER,
    seed: seed,
    month: 1,
    days: 11,
    origin: opt.origin || 'xds',
    bossType: opt.bossType || pick(['steady', 'strong', 'shrewd']),
    stats: { trust: 50, prestige: 45, rep: 50, guanxi: 30, clean: 100, energy: 80 },
    hidden: { lead: 0, dark: [], bossRisk: 0, wind: 0, fam: 0, famBroken: false },
    queue: [],
    gen: {},
    done: [],
    seen: {},
    cool: {},
    flags: {},
    archive: { merit: [], fault: [], mats: [], remarks: [], coop: 0 },
    log: [],
    ending: null,
    sel: null,
    tab: 'desk'
  };
  Pool.init();
  Private.init();
  G.days = Desk.budget();
  Events.fill();
  return G;
}

/* ── 存档 ───────────────────────────── */
function save(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: VER, g: G }));
    return true;
  } catch (e){ return false; }
}
function load(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    var o = JSON.parse(raw);
    if (!o || !o.g) return false;
    G = migrate(o.g, o.v);
    RNG = mulberry32((G.seed || 1) + G.month * 7919);
    return true;
  } catch (e){ return false; }
}
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e){ return false; }
}
function wipe(){
  try { localStorage.removeItem(SAVE_KEY); } catch (e){}
}
/* 每次改结构在这里补一段 */
function migrate(g, v){
  if (!g.archive) g.archive = { merit: [], fault: [], mats: [], remarks: [], coop: 0 };
  if (!g.hidden) g.hidden = { lead: 0, dark: [], bossRisk: 0, wind: 0, fam: 0, famBroken: false };
  if (g.archive.coop == null) g.archive.coop = 0;
  if (!g.cool) g.cool = {};
  if (!g.gen) g.gen = {};
  if (!g.seen) g.seen = {};
  g.ver = VER;
  return g;
}
function exportSave(){
  var blob = new Blob([JSON.stringify({ v: VER, g: G }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '大秘存档_' + ymText(G.month).replace(/[年月]/g, '') + '.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importSave(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if (!o || !o.g) throw 0;
      G = migrate(o.g, o.v);
      save(); cb(true);
    } catch (e){ cb(false); }
  };
  fr.readAsText(file);
}

/* === js/10-stats.js === */
/* ── 10-stats：六格指标、暗数值、家庭压力 ───────────────── */
/* 条上只放你自己的四样东西。
   威信是书记的，挪到班子页他那张卡上；干净是你心里的数，不给看 */
var STAT_DEF = [
  { k: 'trust',  n: '信任', low: 30 },
  { k: 'rep',    n: '官声', low: 25 },
  { k: 'guanxi', n: '人脉', low: 15 },
  { k: 'energy', n: '精力', low: 25 }
];
/* fx 里的键 → 指标键 */
var FX_MAP = { trust: 'trust', pres: 'prestige', rep: 'rep', gx: 'guanxi', clean: 'clean', en: 'energy' };

/* 结局页才摊开 */
/* 四档按实跑量定：六十个月三百次选择，最干净的打法也落在七十上下 */
function CLEAN_WORD(v){
  return v >= 78 ? '一件没伸过手' : v >= 58 ? '大面上过得去，有两回打了擦边'
    : v >= 36 ? '有些事你自己记得，别人不一定知道'
    : v >= 18 ? '经手的东西太多了，你已经不数了'
    : '从哪一件开始的，你想不起来了';
}

var _pending = {};   /* 本次要在界面上飘的增减 */

/* 信任、官声、人脉、威信这四样越高越难往上走。
   不加这条，六十个月下来三格全顶到 100，所有门槛选项一律够得着，
   指标条就成了摆设。往下掉的时候不打折——掉是实打实的 */
var SOFT = { trust:58, rep:45, guanxi:45, prestige:52 };
function gainOf(key, v, cur){
  if (v <= 0 || !SOFT[key]) return v;
  if (cur < SOFT[key]) return v;                /* 这一段照常涨 */
  var f = 1 - (cur - SOFT[key]) / 52;           /* 过了线，一级比一级难 */
  return Math.round(v * Math.max(0.12, f) * 10) / 10;
}

function applyFx(fx){
  if (!fx) return;
  for (var k in fx){
    if (!fx.hasOwnProperty(k)) continue;
    var v = fx[k];
    if (FX_MAP[k]){
      var key = FX_MAP[k];
      var before = G.stats[key];
      G.stats[key] = clamp(before + gainOf(key, v, before), 0, 100);
      _pending[key] = (_pending[key] || 0) + (G.stats[key] - before);
    } else if (k === 'lead'){
      G.hidden.lead = clamp(G.hidden.lead + v, 0, 120);
    } else if (k === 'risk'){
      G.hidden.bossRisk = clamp(G.hidden.bossRisk + v, 0, 100);
    } else if (k === 'fam'){
      famPress(v);
    } else if (k === 'dark'){
      addDark(v);
    } else if (k === 'npc'){
      for (var id in v){ if (v.hasOwnProperty(id)) npcFavor(id, v[id]); }
    } else if (k === 'hr'){
      if (v) Pool.hrMove();
    } else if (k === 'money'){
      if (v < 0) Private.pay(-v); else Private.earn(v);
    } else if (k === 'grudge'){
      Private.addGrudge(v);
    } else if (k === 'owe'){
      Private.addOwe(v.who, v.what, v.back);
    } else if (k === 'heat'){
      for (var pid in v){ if (v.hasOwnProperty(pid)) Pool.addHeat(pid, v[pid]); }
    }
  }
}
function takePending(){ var p = _pending; _pending = {}; return p; }

function addDark(key){
  if (G.hidden.dark.indexOf(key) < 0) G.hidden.dark.push(key);
}
function famPress(v){
  G.hidden.fam = clamp(G.hidden.fam + v, 0, 20);
}
function spendDays(d){
  G.days = Math.max(0, Math.round((G.days - d) * 10) / 10);
}
/* 每件事的真实耗时：数据里写的那个数，再加半天。
   秘书这行没有「顺手就办了」，最短也要半天——找人、等签、走一趟 */
var D_BASE = 0.5;
function dayOf(o){ return Math.round(((o && o.d || 0) + D_BASE) * 10) / 10; }
/* 精力下来了，每件事多耗半天 */
function costOf(d){
  return G.stats.energy < 40 ? d + 0.5 : d;
}
function meritAdd(text){ G.archive.merit.push({ m: G.month, t: text }); }
function faultAdd(text, rule){ G.archive.fault.push({ m: G.month, t: text, rule: rule || null }); }
function keepAdd(text, key){
  if (!text) return;
  var old = null;
  G.archive.mats.forEach(function(x){ if (x.t === text) old = x; });
  if (old){ if (key) old.k = key; return; }
  G.archive.mats.push({ m: G.month, t: text, k: key || null });
}
/* 交出去了就不在你手里了 */
function dropKey(key){
  G.archive.mats.forEach(function(x){ if (x.k === key) x.k = null; });
}
function logAdd(text){
  G.log.push({ m: G.month, t: text });
  if (G.log.length > 400) G.log.shift();
}

/* 一个月过去，有些东西会自己往回落。
   人情放着会淡——你上次给人打电话是半年前的事了；
   名声也一样，机关里没人记得你上个月那件事办得多漂亮；
   书记对你的看法，不办事不办错事的时候，慢慢回到一个平均数上 */
function statDrift(){
  var s = G.stats;
  s.guanxi = clamp(Math.round((s.guanxi - 1.1) * 10) / 10, 0, 100);
  if (s.rep > 50) s.rep = clamp(Math.round((s.rep - 0.9) * 10) / 10, 0, 100);
  var t = s.trust > 52 ? -0.35 : (s.trust < 48 ? 0.35 : 0);
  s.trust = clamp(Math.round((s.trust + t) * 10) / 10, 0, 100);
}

/* 书记家里那摊事，不会因为你不管就停下来。
   他弟弟的公司照样开，捐款照样收，打听的人照样来。
   起了头之后每月自己往上走一点——报上去的那几次，是往回拉的唯一办法 */
function riskDrift(){
  if (!(G.arcs && G.arcs.boss_kin)) return;
  if (G.hidden.bossRisk >= 100) return;
  /* 滚雪球：捂住一件，下一件就更难捂。
     一直往上报的那种局，这个数贴着零走，他就不会出事 */
  var d = 0.2 + G.hidden.bossRisk * 0.017;
  G.hidden.bossRisk = clamp(G.hidden.bossRisk + d, 0, 100);
}

/* 时间会把风声冲淡。手里的事越多，冲得越慢 */
function leadFade(){
  var d = Math.max(0.3, 1.1 - G.hidden.dark.length * 0.12);
  G.hidden.lead = Math.max(0, Math.round((G.hidden.lead - d) * 10) / 10);
}

/* 线索阶梯：界面不给数字，只在过阈值时丢一件待办 */
var LEAD_STAGE = [
  { at: 15, id: 'lead_hint',   once: 'ls15' },
  { at: 35, id: 'lead_talk',   once: 'ls35' },
  { at: 60, id: 'lead_patrol', once: 'ls60' },
  { at: 85, id: 'lead_final',  once: 'ls85' }
];
function checkLead(){
  for (var i = 0; i < LEAD_STAGE.length; i++){
    var s = LEAD_STAGE[i];
    if (G.hidden.lead >= s.at && !G.flags[s.once]){
      G.flags[s.once] = 1;
      if (s.id === 'lead_hint' && G.stats.guanxi < 45) continue; /* 人脉不够就没人提醒你 */
      Desk.push(s.id, 'month');
    }
  }
}

  if (POOL_BY_ID[id]){ Pool.favor(id, v); Pool.reveal(id); }
}

/* === js/21-pool.js === */
/* ── 21-pool：干部池、冲突对热度、露面 ───────────────────── */
var Pool = {

  init: function(){
    if (!G.heat){
      G.heat = {};
      PAIRS.forEach(function(p){ G.heat[p.id] = p.heat; });
    }
    if (!G.met) G.met = {};
    if (!G.pool){
      G.pool = {};
      POOL.forEach(function(x){ G.pool[x.id] = { fav: x.fav, known: x.known, gone: 0 }; });
    }
  },

  /* 谁在这一头。区县对子取一把手，me 是你自己 */
  side: function(k){
    if (k === 'me') return { n:'你', p:'市委办' };
    if (k === 'boss') return { n:'周维安', p:'市委书记' };
    for (var i = 0; i < NPC_DEF.length; i++)
      if (NPC_DEF[i].id === k) return { n:NPC_DEF[i].n, p:NPC_DEF[i].p };
    for (var j = 0; j < QX_DEF.length; j++)
      if (QX_DEF[j].id === k)
        return { n:(G.qxHead && G.qxHead[k]) || QX_DEF[j].head, p:QX_DEF[j].n + '委书记' };
    if (POOL_BY_ID[k]) return { n:POOL_BY_ID[k].n, p:POOL_BY_ID[k].p };
    return { n:k, p:'' };
  },

  heat: function(id){ Pool.init(); return G.heat[id] || 0; },
  addHeat: function(id, v){
    Pool.init();
    if (G.heat[id] == null) return;
    G.heat[id] = clamp(G.heat[id] + v, 0, 100);
  },

  /* 这个人在你眼前出现过一次，班子页才画他 */
  reveal: function(id){
    Pool.init();
    if (POOL_BY_ID[id]) G.met[id] = (G.met[id] || 0) + 1;
  },
  seen: function(id){ Pool.init(); return !!(G.met && G.met[id]); },
  metList: function(){
    Pool.init();
    return POOL.filter(function(x){ return G.met[x.id] && !G.pool[x.id].gone; });
  },

  /* 人事调整落地：这个人真的换了位子 */
  promote: function(id, post){
    Pool.init();
    if (!G.pool[id]) return;
    G.pool[id].post = post;
    G.pool[id].moved = G.month;
    G.met[id] = (G.met[id] || 0) + 1;
  },
  postOf: function(x){
    Pool.init();
    var s = G.pool[x.id];
    return (s && s.post) ? s.post : x.p;
  },

  /* 人事调整落地：换的人真的换 */
  hrMove: function(){
    Pool.init();
    if (G.flags.hrDone) return;
    G.flags.hrDone = G.month;
    if (!G.flags.hr_block_zheng){
      Pool.promote('cg_quzhang', '城关区委书记');
      G.qxHead = G.qxHead || {};
      G.qxHead.chengguan = '郑大林';
    }
    if (G.flags.hr_qin) Pool.promote('bs_fuxian', '白沙县委书记');
    if (G.flags.hr_self){
      G.flags.selfPromoted = G.month;
    } else {
      Pool.promote('fuzhuren', '市委办副秘书长');
    }
  },

  favor: function(id, v){
    Pool.init();
    if (G.pool[id]) G.pool[id].fav = clamp(G.pool[id].fav + v, 0, 100);
  },

  /* 每月：矛盾自己会发酵 */
  /* 热度靠事件推上去，时间只会把它磨平。
     撕破脸之后磨得慢——这才是班子里真实的样子：
     多数人相安无事，少数几对越走越远，而那几对是玩家自己选出来的。 */
  drift: function(){
    Pool.init();
    PAIRS.forEach(function(p){
      var v = G.heat[p.id], d = ri(3) - 1;
      if (rnd() < 0.5) d -= 1;
      if (v >= 70) d = Math.max(d, -1);
      if (p.b === 'me' && G.stats.rep >= 65) d -= 1;
      /* 市长和书记这一对是这局的底色，不管你做什么，一年紧一点 */
      if (p.id === 'p_mayor_boss' && G.month % 12 === 0) d += 3;
      G.heat[p.id] = clamp(v + d, 0, 100);
    });
  },

  /* 秘书长那条规则：你这个月办得越多，他越不舒服 */
  mszRule: function(doneCount, wentToHim){
    Pool.init();
    if (wentToHim) return;
    if (doneCount >= 5) Pool.addHeat('p_msz_me', 4);
    else if (doneCount >= 3) Pool.addHeat('p_msz_me', 2);
  },

  hot: function(min){
    Pool.init();
    return PAIRS.filter(function(p){ return G.heat[p.id] >= (min || 70); });
  },

  /* 热度上来的对子，每月丢一件事到你桌上 */
  pushConflicts: function(){
    if (!G.pairCd) G.pairCd = {};
    /* 到 90 的先摊牌，不再出零碎的冲突待办 */
    var top = Pool.hot(90);
    for (var i = 0; i < top.length; i++){
      var aid = 'sd_' + top[i].id;
      if (!(G.arcs && G.arcs[aid])){ Showdown.start(top[i]); return; }
    }
    var hot = Pool.hot(70).filter(function(p){
      return !(G.pairCd[p.id] && G.pairCd[p.id] > G.month) && !(G.arcs && G.arcs['sd_' + p.id]);
    });
    if (!hot.length) return;
    var p = hot[ri(hot.length)];
    if (G.queue.some(function(q){ return q.pair === p.id && !q.done; })) return;
    G.pairCd[p.id] = G.month + 3;
    var tpl = CONFLICT_TPL[ri(CONFLICT_TPL.length)];
    var it = Desk.pushTpl(tpl, p);
    if (it && G.heat[p.id] >= 90) it.showdown = 1;
  }
};

/* ── 摊牌：热度到 90 的那一对，三幕走完 ── */
var Showdown = {
  start: function(pair){
    if (!G.genArc) G.genArc = {};
    var aid = 'sd_' + pair.id;
    if (G.genArc[aid] || (G.arcs && G.arcs[aid])) return;
    var A = Pool.side(pair.a), B = Pool.side(pair.b);
    function sub(s){
      return String(s == null ? '' : s).replace(/\{A\}/g, A.n).replace(/\{B\}/g, B.n)
        .replace(/\{WHY\}/g, pair.why);
    }
    var stages = SHOWDOWN_TPL.map(function(st, i){
      var next = {};
      if (i < SHOWDOWN_TPL.length - 1) next['*'] = SHOWDOWN_TPL[i + 1].id;
      return {
        id: st.id, src: st.src, gap: st.gap,
        title: sub(st.title), text: sub(st.text), nt: sub(st.nt),
        next: next, lateNext: next['*'] || null,
        neglect: { rep:-3 },
        opts: st.opts.map(function(o){
          var fx = {};
          for (var k in o.fx) fx[k] = o.fx[k];
          if (o.fxA || o.fxB){
            fx.npc = {};
            if (o.fxA) fx.npc[pair.a] = o.fxA;
            if (o.fxB) fx.npc[pair.b] = o.fxB;
          }
          if (o.heat){ fx.heat = {}; fx.heat[pair.id] = o.heat; }
          return { t: sub(o.t), d: o.d, n: sub(o.n), tier: o.tier, rule: o.rule,
                   fx: fx, rk: o.rk };
        })
      };
    });
    G.genArc[aid] = { id: aid, n: A.n + ' 和 ' + B.n, stages: stages };
    Pool.reveal(pair.a); Pool.reveal(pair.b);
    Arcs.start(aid);
  }
};

/* === js/22-people.js === */
/* ── 22-people：排人（书记每月四个空）、秘书长剩下两条规则 ── */
var SLOTS = 4;

var Slots = {

  /* 月初生成本月求见名单 */
  gen: function(){
    if (G.month < 3) return;                       /* 头两个月先让人熟悉队列 */
    var id = 'slot_' + G.month;
    if (G.gen[id]) return;
    if (!G.slotCd) G.slotCd = {};
    var avail = SLOT_POOL.filter(function(c){
      var k = c.who || c.n;
      return !(G.slotCd[k] && G.slotCd[k] > G.month);
    });
    if (avail.length < 5) avail = SLOT_POOL;
    var pool = shuffle(avail).slice(0, 5 + ri(3));
    pool.forEach(function(c){ G.slotCd[c.who || c.n] = G.month + 1 + ri(3); });
    var list = pool.map(function(c, i){
      var s = c.n ? { n: c.n, p: c.p || '' } : Pool.side(c.who);
      return { k: i, who: c.who, n: s.n, p: s.p, why: c.why, tag: c.tag || '',
               inN: c.inN, out: c.out, fxIn: c.fxIn, fxOut: c.fxOut };
    });
    var e = {
      id: id, kind:'slot', src:'书记交办', due:'month', slot:1, list: list,
      title:'本月求见',
      text:'书记这个月能腾出四个半小时。桌上的条子有 ' + list.length + ' 张。\n排进去的当月能见上，剩下的你自己看着办。',
      nt:'你一个也没排。月底书记问起某件事，你说他们都还没来过',
      neglect:{ trust:-4 }, noRoll:1,
      opts:[
        { t:'剩下的让他们下月再来', d:0, tier:'tail',
          n:'条子压在玻璃板底下。有两个人这个月来过三趟',
          fx:{}, rest:'next',
          rk:{} },
        { t:'剩下的请秘书长安排', d:0, tier:'tail',
          n:'邱仲华一口答应，还说以后这种事都可以找他。他会记你一笔',
          fx:{heat:{p_msz_me:-6}}, rest:'msz',
          rk:{ shrewd:'秘书长最近很热心。' } },
        { t:'剩下的我自己见一下', d:0, tier:'good',
          n:'一人半小时，挤在中午和下班后。他们说的话你比书记先知道',
          fx:{}, rest:'me',
          rk:{ steady:'辛苦你了。' } }
      ]
    };
    G.gen[id] = e;
    var it = Desk.push(id, 'month');
    if (it) it.pick = [];
  },

  picked: function(it){ if (!it.pick) it.pick = []; return it.pick; },

  toggle: function(uid, k){
    var it = Desk.find(uid); if (!it || it.done || it.slotDone) return;
    k = +k;
    var p = Slots.picked(it);
    var i = p.indexOf(k);
    if (i >= 0) p.splice(i, 1);
    else { if (p.length >= SLOTS) return; p.push(k); }
    save(); UI.render();
  },

  /* 排定：当月见的人先结算 */
  confirm: function(uid){
    var it = Desk.find(uid); if (!it || it.slotDone) return;
    var e = EV(it.id);
    var cost = costOf(0.5);
    if (cost > G.days + 0.001){ UI.toast('这个月排不下了'); return; }
    spendDays(cost);
    var p = Slots.picked(it), blame = SLOT_BLAME[G.bossType];
    var bad = 0;
    p.forEach(function(k){
      var c = e.list[k];
      applyFx(c.fxIn);
      if (c.who && POOL_BY_ID[c.who]) Pool.reveal(c.who);
      if (blame && c.tag === blame.tag) bad++;
    });
    if (bad){
      applyFx({ trust: -2 * bad });
      G.flags.slotBad = (G.flags.slotBad || 0) + bad;
      it.slotBlame = blame.rk;
    }
    it.slotDone = 1;
    logAdd('本月排人：见了 ' + p.length + ' 个');
    save(); UI.render();
  },

  /* 剩下的怎么处理，在 Desk.choose 里调 */
  rest: function(it, how){
    var e = EV(it.id);
    var left = e.list.filter(function(c, i){ return Slots.picked(it).indexOf(i) < 0; });
    left.forEach(function(c){
      if (how === 'next'){ applyFx(c.fxOut); }
      else if (how === 'msz'){ npcFavor(c.who, -1); }
      else if (how === 'me'){ applyFx({ gx:+1 }); spendDays(0.5); }
    });
    if (how === 'msz') Pool.addHeat('p_msz_me', 4);
  }
};

/* ── 秘书长：压你的件、去书记那说你 ── */
var Msz = {
  tick: function(){
    var h = Pool.heat('p_msz_me');
    if (h >= 80){
      applyFx({ trust:-8 });
      Pool.addHeat('p_msz_me', -(h - 50));
      logAdd('秘书长去书记那坐了一会儿');
      G.flags.mszTold = (G.flags.mszTold || 0) + 1;
      return;
    }
    if (h >= 50){
      var live = G.queue.filter(function(q){ return !q.done && q.due !== 'plan' && !q.held; });
      if (live.length){
        var q = live[ri(live.length)];
        q.held = 1;
      }
    }
  }
};

/* ── 传话：每月有一件，两头从班子和区县里抽 ── */
var TALK_SIDES = ['mayor','vice1','depsec','zuzhi','zhengfa','xuanchuan','tongzhan',
                  'chengguan','gaoxin','gangkou','qingchuan','baisha','meiling'];

var Talk = {
  gen: function(){
    if (G.month < 4) return;
    if (rnd() > 0.4) return;
    var id = 'talk_' + G.month;
    if (G.gen[id]) return;
    var tpl = TALK_TPL[ri(TALK_TPL.length)];
    var a, b = null;
    /* 热度高的对子优先——有矛盾才有话要带 */
    var hot = Pool.hot(45).filter(function(p){ return p.a !== 'me' && p.b !== 'me' && p.b !== 'boss'; });
    if (tpl.kind === 'between' && hot.length){
      var pr = hot[ri(hot.length)];
      a = pr.a; b = pr.b;
    } else {
      a = TALK_SIDES[ri(TALK_SIDES.length)];
      if (tpl.kind === 'between'){
        do { b = TALK_SIDES[ri(TALK_SIDES.length)]; } while (b === a);
      }
    }
    var A = Pool.side(a), B = b ? Pool.side(b) : { n:'', p:'' };
    var pairId = null, why = '两个人之间早就有话';
    PAIRS.forEach(function(p){
      if ((p.a === a && p.b === b) || (p.a === b && p.b === a)){ pairId = p.id; why = p.why; }
      if (!pairId && tpl.kind !== 'between' && ((p.a === a && p.b === 'boss') || (p.b === a && p.a === 'boss'))){ pairId = p.id; why = p.why; }
    });
    function sub(s){
      return String(s == null ? '' : s).replace(/\{A\}/g, A.n).replace(/\{B\}/g, B.n)
        .replace(/\{AP\}/g, A.p).replace(/\{BP\}/g, B.p)
        .replace(/\{WHY\}/g, why);
    }
    var e = {
      id: id, kind:'note', src:'有人找你', due:'month',
      title: sub(tpl.title), text: sub(tpl.text), nt: sub(tpl.nt),
      neglect: { rep:-2 },
      opts: tpl.opts.map(function(o){
        var fx = {};
        for (var k in o.fx) fx[k] = o.fx[k];
        if (o.fxA || o.fxB){
          fx.npc = {};
          if (o.fxA) fx.npc[a] = o.fxA;
          if (o.fxB && b) fx.npc[b] = o.fxB;
        }
        if (o.heat && pairId){ fx.heat = {}; fx.heat[pairId] = o.heat; }
        return { t: sub(o.t), d: o.d, n: sub(o.n), tier: o.tier, rule: o.rule, fx: fx, rk: o.rk };
      })
    };
    G.gen[id] = e;
    Desk.push(id, 'month');
  }
};

/* === js/23-private.js === */
/* ── 23-private：家底、欠账、报复链、写死的时间表 ───────── */
var Private = {

  init: function(){
    if (G.money == null) G.money = 8;       /* 万。两口子干了七八年，首付掏完就剩这些 */
    if (!G.owe) G.owe = [];
    if (!G.grudge) G.grudge = {};
    if (!G.hurt) G.hurt = {};
    if (!G.sched) G.sched = {};
  },

  /* 家底 */
  can: function(v){ Private.init(); return G.money >= v; },
  pay: function(v){ Private.init(); G.money = Math.round((G.money - v) * 10) / 10; },
  earn: function(v){ Private.init(); G.money = Math.round((G.money + v) * 10) / 10; },
  moneyWord: function(){
    var v = G.money;
    return v >= 30 ? '手头宽裕' : v >= 15 ? '过得去'
      : v >= 8 ? '经不起一件大事' : v >= 3 ? '这个月的水电还没交'
      : '找谁开口都张不了嘴';
  },

  /* 欠账 */
  addOwe: function(who, what, back){
    Private.init();
    G.owe.push({ who: who, what: what, back: back || '',
      m: G.month, due: G.month + 3 + ri(4), done: 0 });
  },
  oweOpen: function(){ Private.init(); return G.owe.filter(function(o){ return !o.done; }); },

  /* 仇 */
  addGrudge: function(id){
    Private.init();
    if (!id) return;
    G.grudge[id] = (G.grudge[id] || 0) + 1;
  },

  /* 每月跑一遍 */
  tick: function(){
    Private.init();
    Private.earn(0.25);                     /* 两份工资，还着房贷，一年攒三万 */
    Private.schedule();
    Private.her();
    Private.collect();
    Private.revenge();
  },

  /* 到月份就来 */
  schedule: function(){
    PRIVATE_SCHED.forEach(function(s){
      if (G.sched[s.id]) return;
      if (G.month < s.at[0]) return;
      if (G.month > s.at[1] + 6) { G.sched[s.id] = 'skip'; return; }
      if (G.month === s.at[0] || rnd() < 0.5 || G.month >= s.at[1]){
        if (EV(s.id)){ G.sched[s.id] = G.month; Desk.push(s.id, 'month'); }
      }
    });
  },

  /* 连着三个月加班，而且家里早就不问了 */
  her: function(){
    if (G.seen.her_water) return;
    if ((G.otRun || 0) < 3) return;
    if (G.hidden.fam < 10) return;
    if (!EV('her_water')) return;
    Desk.push('her_water', 'month');
  },

  /* 欠的账到期了，他来要 */
  collect: function(){
    var open = Private.oweOpen();
    for (var i = 0; i < open.length; i++){
      var o = open[i];
      if (o.due > G.month) continue;
      if (o.pushed) continue;
      var id = 'owe_' + i + '_' + G.month;
      if (G.gen[id]) continue;
      var who = Pool.side(o.who);
      function sub(s){
        return String(s || '').replace(/\{WHO\}/g, who.n + '　' + who.p)
          .replace(/\{WHAT\}/g, o.what).replace(/\{BACK\}/g, o.back || '那件事就当没办过');
      }
      var e = {
        id: id, kind:'note', src:'有人找你', due:'month',
        title: sub(OWE_TPL.title), text: sub(OWE_TPL.text), nt: sub(OWE_TPL.nt),
        neglect: { rep:-3 }, oweIdx: i,
        opts: OWE_TPL.opts.map(function(x){
          var fx = {};
          for (var k in x.fx) fx[k] = x.fx[k];
          if (x.fxWho){ fx.npc = {}; fx.npc[o.who] = x.fxWho; }
          return { t: sub(x.t), d: x.d, n: sub(x.n), tier: x.tier, rule: x.rule,
                   fx: fx, rk: x.rk, clear: x.clear, renege: x.renege, oweIdx: i,
                   grudge: x.grudge ? o.who : null };
        })
      };
      G.gen[id] = e;
      o.pushed = 1;
      Desk.push(id, 'month');
      break;      /* 一个月最多来一个人要账 */
    }
  },

  /* 你拒过谁，谁就动你家的人。不写第四句 */
  revenge: function(){
    Private.init();
    for (var id in G.grudge){
      if (G.grudge[id] < 2) continue;
      var c = CAN_HURT[id];
      if (!c || G.hurt[c.kin]) continue;
      if (!EV(c.ev)) continue;
      G.hurt[c.kin] = 1;
      G.grudge[id] = 0;
      Desk.push(c.ev, 'month');
      return;
    }
  },

  /* 欠账没还：他把给你的东西收回去 */
  renege: function(idx){
    Private.init();
    var o = G.owe[idx];
    if (!o) return;
    o.done = 'renege';
    faultAdd('欠' + Pool.side(o.who).n + '的那件事，没还', null);
  },
  settle: function(idx){
    Private.init();
    var o = G.owe[idx];
    if (o) o.done = 'paid';
  }
};

/* ── 24-cut：插队。三种事从队列外面进来，抢的是你的天数 ──
   随行、书记临时叫你、出差撞上家里。它们不参与随机抽取，
   也不顺延——这个月的时间过去了就是过去了 */

  gen: function(){
    if (G.ending || G.month < 3) return;

    /* 随行：一年三四回。家里正紧的时候，来的是另一件 */

};

        h += '<div style="margin-top:10px;display:flex;align-items:center;gap:12px">' +
          '<button class="btn pri" id="slotok"' + (pk.length ? '' : ' disabled') + '>就这么排</button>' +
          '<span style="font-size:13px;color:var(--ink3)">' +
          (pk.length >= 4 ? '四个空满了' : '还空着 ' + (4 - pk.length) + ' 个') + '</span></div>';
        return h + '</div>';
      }
      h += '<div class="result" style="margin-top:12px"><div class="r">';
      pk.forEach(function(k){ h += esc(e.list[k].n) + '　' + esc(e.list[k].inN) + '<br>'; });
      h += '</div>' + (q.slotBlame ? '<div class="keep">书记后来说了一句：' + esc(q.slotBlame) + '</div>' : '') +
        '</div>';
      h += '<div class="hr"></div><div class="lab">剩 下 的</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">';
      e.list.forEach(function(c, i){ if (pk.indexOf(i) < 0) h += esc(c.n) + '　'; });
      h += '</div>';
    }
    if (e.mats && e.mats.length){
      h += '<div class="hr"></div><div class="lab">材 料</div><div class="mats">';
      e.mats.forEach(function(m){
        var got = Dossier.hasRead(q, m.id);
        if (got){
          h += '<div class="mat on"><div class="mt">' + esc(m.t) +
            '<span class="mf">' + esc(m.from) + '</span></div>' +
            '<div class="mx">' + esc(m.text) + '</div></div>';
        } else {
          var c = Dossier.seenBefore(m.id) ? '看过了' : (m.d || 0.5) + ' 天';
          h += '<button class="mat" data-m="' + m.id + '"><div class="mt">' + esc(m.t) +
            '<span class="mf">' + esc(m.from) + ' · ' + c + '</span></div></button>';
        }
      });
      h += '</div>';
    }
    if (e.finds && e.finds.length){
      h += '<div class="lab" style="margin-top:12px">这 件 事 到 底 是 怎 么 回 事</div><div class="finds">';
      e.finds.forEach(function(f){
        var st = Dossier.findState(q, e, f);
        h += '<div class="find' + (st.on ? ' on' : '') + '">' +
          (st.on ? '●' : '○') + '　' + esc(f.t) + '</div>';
      });
      h += '</div>';
    }
    if (e.acts){
      var tl = Meeting.tally(q, e);
      h += '<div class="hr"></div><div class="lab">票 面</div><div class="votes">';
      VOTERS.forEach(function(id){
        var s = Pool.side(id), kn = Meeting.known(q, e, id);
        var v = Meeting.lean(q, e, id);
        h += '<div class="vote"><span class="vn">' + esc(s.n) + '<i>' + esc(s.p) + '</i></span>' +
          '<span class="vv' + (kn ? (v > 0 ? ' y' : ' n') : '') + '">' +
          (kn ? Meeting.word(v) : '？') + '</span></div>';
      });
      h += '</div>';
      var unknown = VOTERS.filter(function(id){ return !Meeting.known(q, e, id); }).length;
      h += '<div class="bar-note" style="padding:6px 0 0">' +
        (unknown ? '还有 ' + unknown + ' 个人的态度你不知道' :
          '数下来 ' + tl.yes + ' 比 ' + tl.no) + '</div>';
      if (!q.done){
        h += '<div class="lab" style="margin-top:12px">做 工 作</div><div class="opts">';
        e.acts.forEach(function(a, i){
          var used = q.acted && q.acted[i];
          var lackA = a.req && !Desk.meet(a.req);
          var cA = costOf(a.d || 1) + (q.held ? 1 : 0);
          var noA = used || lackA || cA > G.days + 0.001;
          h += '<button class="opt" data-a="' + i + '"' + (noA ? ' disabled' : '') + '>' +
            '<span class="d">' + (used ? '已经去过了' : (lackA ? '' : cA + ' 天')) + '</span>' +
            '<span class="t">' + esc(a.t) + '</span>' +
            '<div class="n">' + esc(used ? (a.after || a.n) : (lackA ? (a.nlow || '') : a.n)) + '</div>' +
            '</button>';
        });
        h += '</div>';
      }
    }
    h += '<div class="hr"></div><div class="lab">' +
      (e.acts ? '开 会 那 天' : '拟 办 意 见') + '</div><div class="opts">';
    e.opts.forEach(function(o, i){
      var lackF = o.reqFind && !Dossier.lit(q, e, o.reqFind);
      var lack = lackF || (o.req && !Desk.meet(o.req));
      var cost = costOf(dayOf(o)) + (q.held ? 1 : 0);
      var noRoom = cost > G.days + 0.001 && !e.force;
      var nod = lack || noRoom;
      var note = lackF ? Dossier.lackWord(q, e, o.reqFind)
        : (lack ? (o.nlow || '') : (o.n || ''));
      h += '<button class="opt' + (o.rule ? ' gray' : '') + '" data-o="' + i + '"' +
        (nod ? ' disabled' : '') + '><span class="d">' +
        (lack ? '' : (noRoom ? '排不下' : (cost ? cost + ' 天' : '当场'))) + '</span>' +
        '<span class="t">' + esc(o.t) + '</span>' +
        (note ? '<div class="n">' + esc(note) + '</div>' : '') + '</button>';
    });
    h += '</div>';
    return h + '</div>';
  },

         lines(a.fault) + '</div>';

         lines(a.mats) + '</div>';

  bind: function(){
    UI.artFallback();
    $$('.tab').forEach(function(b){
      on(b, 'click', function(){ G.tab = b.dataset.tab; UI.render(); });
    });
    on($('#endmo'), 'click', UI.askNight);
    $$('.q').forEach(function(b){
      on(b, 'click', function(){ G.sel = b.dataset.q; UI.render(); });
    });
    $$('.opt[data-a]').forEach(function(b){
      on(b, 'click', function(){ if (!b.disabled) Meeting.work(G.sel, +b.dataset.a); });
    });
    $$('.slot[data-k]').forEach(function(b){
      on(b, 'click', function(){ if (!b.disabled) Slots.toggle(G.sel, b.dataset.k); });
    });
    on($('#slotok'), 'click', function(){ Slots.confirm(G.sel); });
    $$('.mat[data-m]').forEach(function(b){
      on(b, 'click', function(){ Dossier.read(G.sel, b.dataset.m); });
    });
    $$('.opt').forEach(function(b){
      on(b, 'click', function(){ if (!b.disabled) Desk.choose(G.sel, +b.dataset.o); });
    });
    on($('#exp'), 'click', exportSave);
    on($('#newg'), 'click', function(){
      UI.confirm('重开一局？现在这局就没了。', function(){ wipe(); UI.start(); });
    });
    var imp = $('#imp');
    if (imp) on(imp, 'change', function(){
      if (imp.files[0]) importSave(imp.files[0], function(ok){
        if (ok) UI.render(); else UI.toast('这个文件读不出来');
      });
    });
  },

  /* 没有这张图就把它那一块整个去掉，不留空洞 */
  artFallback: function(root){
    $$('img.art', root).forEach(function(im){
      im.onerror = function(){
        var w = im.parentNode;
        if (w && w.className === 'artwrap') w.parentNode.removeChild(w);
        else if (im.parentNode) im.parentNode.removeChild(im);
      };
      im.onload = function(){
        var c = im.parentNode && im.parentNode.parentNode;
        if (c && c.className.indexOf('card') >= 0) c.className += ' has-face';
      };
      if (im.complete){ im.naturalWidth === 0 ? im.onerror() : im.onload(); }
    });
  },

  flash: function(){
    setTimeout(function(){ $$('.delta').forEach(function(d){ d.classList.add('on'); }); }, 30);
    setTimeout(function(){ $$('.delta').forEach(function(d){ d.classList.remove('on'); }); }, 2200);
  },

  open: function(title, body, foot){
    UI.close();
    var d = document.createElement('div');

    d.innerHTML = '<div class="modal">' + (title ? '<h3>' + title + '</h3>' : '') +
      '<div class="body">' + body + '</div><div class="foot">' + (foot || '') + '</div></div>';
    document.body.appendChild(d);
    UI.modal = d;
    UI.artFallback(d);
    return d;

      b += '<div class="lab">这 个 月 没 办 完 的</div><div style="margin-bottom:14px">';

        b += '<div class="kv"><i>' + DUE_TAG[q.due] + '</i><span>' + esc(q.title) + '</span></div>';
      });
      b += '</div>';
    }
    b += '<div class="lab">这 个 月 末</div><div class="opts">';
    Desk.NIGHT.forEach(function(n){
      var dis = (n.k === 'fam' && G.hidden.famBroken);
      b += '<button class="opt" data-n="' + n.k + '"' + (dis ? ' disabled' : '') + '>' +
        '<span class="t">' + n.n + '</span><div class="n">' +

  showRemarks: function(res){
    var rs = (res && res.remarks) || [], ms = (res && res.missed) || [];
    if (G.ending || (!rs.length && !ms.length)){ G.sel = null; UI.render(); return; }
    var b = '';
    if (ms.length){
      b += '<div class="lab">没 办 的 那 几 件</div>';
      ms.forEach(function(m){
        b += '<div class="kv"><i>' + esc(m.on) + '</i><span>' + esc(m.t) + '</span></div>';
      });
      b += '<div style="height:14px"></div>';
    }
    if (rs.length) b += '<div class="lab">书 记 批 示</div>';
    rs.forEach(function(r){ b += UI.remarkHTML(r.t, r.on); });
    var d = UI.open(ymText(G.month - 1) + ' 呈阅件', b,
      '<button class="btn pri" data-x>进入 ' + ymText(G.month) + '</button>');
    on($('[data-x]', d), 'click', function(){ UI.close(); G.sel = null; UI.render(); });

  remarkHTML: function(txt, on){

      '<span class="on">' + esc(on) + '</span></div>';
    return '<div class="remark">' + esc(txt) + '<span class="on">' + esc(on) + '</span></div>';
  },

  renderEnd: function(){
    UI.close();
    Private.init(); npcInit(); Pool.init();
    var e = ENDINGS[G.ending] || { n:'结束', p:[], end:'' };
    var a = G.archive, mo = G.endAt || Math.min(G.month, TERM);

      artWrap('e_' + G.ending + '.png', 'art-end') + '<div class="doc">';

    h += '<h2 style="font-size:24px">' + esc(e.n) + '</h2>';
    h += '<div class="sub">' + ymText(mo) + ' · 第 ' + mo + ' 个月</div>';
    (e.p || []).forEach(function(s){ h += '<p>' + esc(s) + '</p>'; });
    if (e.end) h += '<div class="result"><div class="r">' + esc(e.end) + '</div></div>';
    h += '</div></div>';

    function block(title, rows, empty){
      var s = '<div class="panel" style="margin-top:12px"><h3>' + title + '</h3>';
      if (!rows.length) return s + '<div class="empty">' + (empty || '—') + '</div></div>';
      s += '<div style="padding:8px 14px">';
      rows.forEach(function(r){
        s += '<div class="kv"><i>' + r[0] + '</i><span style="text-align:right;max-width:74%">' +
          r[1] + '</span></div>';
      });
      return s + '</div></div>';
    }

    h += block('履历 · 功', a.merit.slice(-8).map(function(x){
      return [ymText(x.m), esc(x.t)]; }), '这五年你什么也没留下');
    h += block('履历 · 过', a.fault.map(function(x){
      var r = x.rule && RULES[x.rule];
      return [ymText(x.m), esc(x.t) + (r ? '　<b style="color:' +
        (r.red ? 'var(--red)' : 'var(--ink3)') + '">' + r.n + '</b>' : '')]; }), '干净');
    h += block('手里留下的', a.mats.slice(-12).map(function(x){
      return [ymText(x.m), esc(x.t)]; }), '什么也没剩下');
    h += block('欠过的人情', (G.owe || []).map(function(o){
      return [ymText(o.m) + ' · ' + esc(Pool.side(o.who).n),
        esc(o.what) + '　' + (o.done === 'paid' ? '还了' :
          o.done === 'renege' ? '<b style="color:var(--red)">没还</b>' : '还欠着')]; }), '没欠过谁');

    /* 你自己的账和家里 */
    h += '<div class="panel" style="margin-top:12px"><h3>你自己</h3><div style="padding:10px 14px">' +

/* === js/40-desk.js === */
/* ── 40-desk：待办队列、期限标签、顺延、月末安排 ─────────── */
var DUE_ORDER = { over:0, month:1, next:2, plan:3 };
var DUE_TAG   = { over:'逾期', month:'本月', next:'下月', plan:'已排期' };

var ROUTINE = [
  { t:'随书记去省里', d:[2,4] },   { t:'陪同检查', d:[2,3] },
  { t:'会议记录', d:[2,4] },       { t:'值班', d:[1,3] },
  { t:'接待上面来的人', d:[2,3] }, { t:'各种会签', d:[2,3] },
  { t:'书记的行程和电话', d:[3,4] },{ t:'两会材料', d:[2,4] }
];

var Desk = {

  /* 一个月 20 个工作日，先被例行的事占掉十到十四天 */
  budget: function(){
    var pool = shuffle(ROUTINE), used = 0, txt = [];
    for (var i = 0; i < pool.length && (used < 10 || txt.length < 3); i++){
      if (used >= 14) break;
      var r = pool[i], d = r.d[0] + ri(r.d[1] - r.d[0] + 1);
      used += d; txt.push(r.t + ' ' + d + ' 天');
    }
    G.routine = txt.join('，');
    return WORKDAYS - used;
  },

  push: function(id, due, plan){
    var e = EV(id);
    if (!e) return null;
    var it = {
      uid: uid(), id: id, due: due || e.due || 'month',
      plan: plan || 0, done: false, res: null, tier: null,
      title: e.title, src: e.src || '—', kind: e.kind || 'note',
      minD: Math.min.apply(null, (e.opts || [{ d:1 }]).map(function(o){ return dayOf(o); })),
      read: {},
      bumped: 0
    };
    G.queue.push(it);
    if (e.reveal) e.reveal.forEach(function(x){ Pool.reveal(x); });
    G.seen[id] = (G.seen[id] || 0) + 1;
    if (e.cd) G.cool[id] = G.month + e.cd;
    return it;
  },

  meet: function(req){
    if (!req) return true;
    for (var k in req){
      if (k === 'money'){ if (!Private.can(req[k])) return false; continue; }
      if (k === 'keep'){
        var want = req[k], got = false;
        G.archive.mats.forEach(function(m){ if (m.t.indexOf(want) >= 0) got = true; });
        if (!got) return false;
        continue;
      }
      /* 关键件。看过的材料都会进档案，但能拿出去的只有这么几样 */
      if (k === 'key'){
        var kk = req[k], has = false;
        G.archive.mats.forEach(function(m){ if (m.k && (kk === 1 || m.k === kk)) has = true; });
        if (!has) return false;
        continue;
      }
      var key = FX_MAP[k] || k;
      if ((G.stats[key] || 0) < req[k]) return false;
    }
    return true;
  },

  /* 冲突模板 → 一件真的待办 */
  pushTpl: function(tpl, pair){
    var A = Pool.side(pair.a), B = Pool.side(pair.b);
    function sub(s){
      if (s == null) return s;
      return String(s).replace(/\{A\}/g, A.n).replace(/\{B\}/g, B.n)
        .replace(/\{AP\}/g, A.p).replace(/\{BP\}/g, B.p)
        .replace(/\{WHY\}/g, pair.why);
    }
    var id = 'tpl_' + pair.id + '_' + G.month;
    if (G.gen[id]) return null;
    var e = {
      id: id, kind:'note', src: tpl.src || '有人找你', due:'month',
      title: sub(tpl.title), text: sub(tpl.text), nt: sub(tpl.nt),
      neglect: tpl.neglect || { rep:-2 }, pair: pair.id,
      opts: tpl.opts.map(function(o){
        var fx = {};
        for (var k in o.fx) fx[k] = o.fx[k];
        if (o.fxA || o.fxB){
          fx.npc = {};
          if (o.fxA) fx.npc[pair.a] = o.fxA;
          if (o.fxB) fx.npc[pair.b] = o.fxB;
        }
        if (o.heat){ fx.heat = {}; fx.heat[pair.id] = o.heat; }
        var rk = o.rk;
        if (rk && typeof rk === 'object'){
          rk = {};
          for (var s in o.rk) rk[s] = sub(o.rk[s]);
        }
        return { t: sub(o.t), d: o.d, n: sub(o.n), tier: o.tier,
                 rule: o.rule, keep: sub(o.keep), rk: rk, fx: fx,
                 grudge: o.grudgeA ? pair.a : (o.grudgeB ? pair.b : null) };
      })
    };
    G.gen[id] = e;
    Pool.reveal(pair.a); Pool.reveal(pair.b);
    var it = Desk.push(id, 'month');
    if (it) it.pair = pair.id;
    return it;
  },

  has: function(id){ return G.queue.some(function(q){ return q.id === id && !q.done; }); },
  hasFam: function(){
    return G.queue.some(function(q){ var e = EV(q.id); return e && e.fam && !q.done; });
  },
  live: function(){
    return G.queue.filter(function(q){ return !q.done && q.due !== 'plan'; }).length;
  },
  list: function(){
    return G.queue.slice().sort(function(a, b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (DUE_ORDER[a.due] - DUE_ORDER[b.due]) || 0;
    });
  },
  find: function(u){
    for (var i = 0; i < G.queue.length; i++) if (G.queue[i].uid === u) return G.queue[i];
    return null;
  },
  /* 期限还剩几天 */
  daysLeft: function(it){
    if (it.due === 'plan') return null;
    if (it.due === 'next') return Math.round((G.days + WORKDAYS) * 10) / 10;
    return G.days;
  },

  /* 选了一条拟办意见 */
  choose: function(u, idx){
    var it = Desk.find(u); if (!it || it.done) return;
    var e = EV(it.id); var o = e.opts[idx]; if (!o) return;
    if (o.req && !Desk.meet(o.req)) return;
    if (o.reqFind && !Dossier.lit(it, e, o.reqFind)) return;
    if (e.slot && !it.slotDone){ UI.toast('先把这四个空排了'); return; }
    var cost = costOf(dayOf(o)) + (it.held ? 1 : 0);
    if (cost > G.days + 0.001 && !e.force){
      UI.toast('这个月剩下的天数不够了');
      return;
    }
    spendDays(cost);
    applyFx(o.fx);
    if (o.rule){
      var r = ruleOf(o.rule);
      applyFx({ lead: leadOf(o.rule) });
      faultAdd(e.title + '：' + o.t, o.rule);
      if (r && r.red){ G.flags.redline = 1; applyFx({ risk:+2 }); }
    } else {
      meritAdd(e.title + '：' + o.t);
    }
    if (o.coop) G.archive.coop += o.coop;
    if (o.setf) for (var fk in o.setf) G.flags[fk] = o.setf[fk];
    if (o.rest) Slots.rest(it, o.rest);
    if (o.grudge) Private.addGrudge(o.grudge);
    if (o.clear && o.oweIdx != null) Private.settle(o.oweIdx);
    if (o.renege && o.oweIdx != null) Private.renege(o.oweIdx);
    if (o.keep) keepAdd(o.keep, o.keyk);
    if (o.dropk) dropKey(o.dropk);
    /* 人情是消耗品：一个电话打出去就少一个 */
    if (o.req && o.req.gx && !(o.fx && o.fx.gx < 0)) applyFx({ gx: -(2 + Math.round(o.req.gx / 12)) });
    it.done = true;
    it.tier = o.tier || (o.rule ? 'gray' : 'good');
    it.res = { t: o.t, n: o.n || '', keep: o.keep || '', rule: o.rule || null };
    G.done.push({ id: it.id, title: e.title, tier: it.tier, opt: o.t, rk: o.rk });
    logAdd(e.title + ' → ' + o.t);
    if (e.acts){
      var tl = Meeting.tally(it, e);
      it.tally = tl;
      applyFx(tl.pass ? o.passFx : o.failFx);
      /* 议题过没过，就是他在班子里说话的分量 */
      applyFx({ pres: tl.pass ? +2 : -3 });
      it.res.n = (tl.pass ? (o.passN || '') : (o.failN || '')) || it.res.n;
      it.res.t = it.res.t + '　——　' + tl.yes + ' 比 ' + tl.no + '，' + (tl.pass ? '过了' : '没过');
      logAdd(e.title + '：' + tl.yes + ' 比 ' + tl.no);
    }
    checkLead();
    if (e.arc) Arcs.advance(e, idx, it);
    if (o.end) Endings.trigger(o.end);
    if (e.endBy === 'patrol') Endings.patrol();
    else if (e.endBy === 'boss') Endings.bossLeave();
    save();
    UI.render();
  },

  /* 月末：没办的怎么处理。真没办成的，那句话月末才说 */
  rollover: function(){
    var keep = [];
    G.missed = [];
    G.queue.forEach(function(q){
      if (q.done) return;
      var e = EV(q.id);
      if (e.noRoll){
        applyFx(e.neglect);
        if (e.nt) G.missed.push({ on: e.title, t: e.nt });
        logAdd(e.title + ' → 这个月过去了');
        return;
      }
      if (q.due === 'over'){
        /* 逾期再没办 → 按不办的后果结算 */
        applyFx(e.neglect);
        faultAdd(e.title + '：没办', null);
        if (e.nt) G.missed.push({ on: e.title, t: e.nt });
        logAdd(e.title + ' → 没办，按后果结算');
        if (e.overdue_to && EV(e.overdue_to)){
          var n = Desk.push(e.overdue_to, 'month');
          if (n) n.bumped = 1;
        }
        if (e.arc && e.lateNext){
          var arc = Arcs.def(e.arc), ns = arc && Arcs.stageOf(arc, e.lateNext);
          if (ns){
            if (G.arcs && G.arcs[e.arc]) G.arcs[e.arc].stage = e.lateNext;
            var g = ns.gap == null ? 2 : ns.gap;
            Arcs.push(e.arc, e.lateNext, g > 0 ? 'plan' : 'month', g);
          }
        }
        return;   /* 移出队列 */
      }
      if (q.due === 'month'){ q.due = 'over'; q.bumped = 1; keep.push(q); return; }
      if (q.due === 'next'){ q.due = 'month'; keep.push(q); return; }
      if (q.due === 'plan'){
        q.plan = Math.max(0, (q.plan || 1) - 1);
        if (q.plan === 0) q.due = 'month';
        keep.push(q); return;
      }
      keep.push(q);
    });
    G.queue = keep;
  },

  /* 月末安排四选一 */
  NIGHT: [
    { k:'rest', n:'按点下班，周末不开机',
      d:'两天电话没响。周一早上进办公室，脑子是空的', fx:{ en:+26 } },
    { k:'fam',  n:'把周末给家里',
      d:'带孩子去了趟公园。手机响了三次，你接了一次', fx:{ en:+12, fam:-2 } },
    { k:'ot',   n:'周末在办公室',
      d:'下个月能多出四天。这四天是从身上抠的', fx:{ en:-10, fam:+1 }, bonus:4 },
    { k:'msz',  n:'去秘书长办公室坐坐',
      d:'两壶茶，他讲的全是十年前的人和事。你一句没插嘴', fx:{ rep:+1 }, heat:-10 }
  ],

  endMonth: function(choiceKey){
    var c = null;
    for (var i = 0; i < Desk.NIGHT.length; i++) if (Desk.NIGHT[i].k === choiceKey) c = Desk.NIGHT[i];
    if (!c) c = Desk.NIGHT[0];
    if (c.k === 'fam' && G.hidden.famBroken) c = Desk.NIGHT[0];

    applyFx(c.fx);
    G.otRun = (c.k === 'ot') ? (G.otRun || 0) + 1 : 0;
    if (c.heat) Pool.addHeat('p_msz_me', c.heat);
    var bonus = c.bonus || 0;

    /* 家里的事连着不办 → 破裂 */
    var famMissed = G.queue.some(function(q){
      var e = EV(q.id); return e && e.fam && !q.done && q.due === 'over';
    });
    var famDone = G.queue.some(function(q){
      var e = EV(q.id); return e && e.fam && q.done;
    });
    if (famMissed){
      G.flags.famMiss = (G.flags.famMiss || 0) + 1;
      /* 连着两回，而且家里早就不问了，才是真的散了 */
      if (G.flags.famMiss >= 2 && G.hidden.fam >= 10) G.hidden.famBroken = true;
    } else if (famDone){
      G.flags.famMiss = 0;
    }

    Pool.mszRule(G.done.length, c.k === 'msz');
    var remarks = Remark.build();
    Desk.rollover();
    var missed = G.missed || [];

    G.done = [];
    G.month += 1;
    G.days = Desk.budget() + bonus;
    leadFade();
    riskDrift();
    statDrift();
    G.hidden.wind = Math.floor((G.month - 1) / 24);
    Pool.drift();
    Msz.tick();
    Private.tick();
    checkLead();
    Endings.tick();

    if (G.month > TERM){
      Endings.settle();
    } else {
      Events.fill();
    }
    save();
    return { remarks: remarks, missed: missed };
  }
};

/* === js/41-dossier.js === */
/* ── 41-dossier：卷宗。先看材料，再办。
   没看的材料只有标题；看完才知道它支持哪条认定；
   认定够了，某些拟办意见才点得动 ── */
var Dossier = {

  /* 这件事已经看过哪些材料 */
  readOf: function(it){ if (!it.read) it.read = {}; return it.read; },

  hasRead: function(it, mid){ return !!Dossier.readOf(it)[mid]; },

  /* 同一份材料在别的卷宗里看过，就不用再花天数 */
  seenBefore: function(mid){
    return !!(G.mats && G.mats[mid]);
  },

  read: function(uid, mid){
    var it = Desk.find(uid); if (!it || it.done) return;
    var e = EV(it.id); if (!e || !e.mats) return;
    var m = null;
    for (var i = 0; i < e.mats.length; i++) if (e.mats[i].id === mid) m = e.mats[i];
    if (!m || Dossier.hasRead(it, mid)) return;
    var cost = Dossier.seenBefore(mid) ? 0 : costOf(m.d || 0.5);
    if (cost > G.days + 0.001){ UI.toast('这个月排不下了'); return; }
    spendDays(cost);
    Dossier.readOf(it)[mid] = 1;
    if (!G.mats) G.mats = {};
    G.mats[mid] = 1;
    keepAdd(m.t, m.key);
    save();
    UI.render();
  },

  /* 这条认定够不够 */
  findState: function(it, e, f){
    var n = 0;
    (e.mats || []).forEach(function(m){
      if (!Dossier.hasRead(it, m.id)) return;
      if ((m.for || []).indexOf(f.id) >= 0) n++;
      if ((m.against || []).indexOf(f.id) >= 0) n--;
    });
    return { n: n, on: n >= (f.need || 1) };
  },

  lit: function(it, e, fid){
    if (!e.finds) return false;
    for (var i = 0; i < e.finds.length; i++)
      if (e.finds[i].id === fid) return Dossier.findState(it, e, e.finds[i]).on;
    return false;
  },

  /* 门槛选项还差什么——说人话，不说「还需 1 份」 */
  lackWord: function(it, e, fid){
    var f = null;
    for (var i = 0; i < (e.finds || []).length; i++) if (e.finds[i].id === fid) f = e.finds[i];
    if (!f) return '';
    var un = (e.mats || []).filter(function(m){
      return !Dossier.hasRead(it, m.id) && (m.for || []).indexOf(fid) >= 0;
    });
    if (un.length) return '这话现在说不出口，' + un[0].t + '你还没看';
    return '手上这些材料撑不住这个说法';
  }
};

/* === js/44-meeting.js === */
/* ── 44-meeting：常委会。材料是每个人的书面态度，
   没看过的人，票面上是一个问号。做工作花天数，
   底线议题上好感不管用——得有把柄或者交换 ── */
var VOTERS = ['mayor','vice1','depsec','jiwei','zuzhi','zhengfa','xuanchuan','mishuzhang','tongzhan'];

var Meeting = {

  /* 这个人现在倾向哪边 */
  lean: function(it, e, id){
    var v = (e.lean && e.lean[id] != null) ? e.lean[id] : 0;
    var d = (it.eff && it.eff[id]) || 0;
    /* 底线议题：好感不起作用，只有做工作能撬 */
    var def = null;
    for (var i = 0; i < NPC_DEF.length; i++) if (NPC_DEF[i].id === id) def = NPC_DEF[i];
    var bottom = def && def.bottom && (def.bottom === e.topic || def.bottom === '全部');
    if (!bottom){
      var fav = (G.npc && G.npc[id]) ? G.npc[id].fav : 45;
      v += (fav - 45) / 25;
    }
    return v + d;
  },

  /* 这个人的态度你看过没有 */
  known: function(it, e, id){
    if (!e.mats) return true;
    for (var i = 0; i < e.mats.length; i++)
      if (e.mats[i].who === id) return Dossier.hasRead(it, e.mats[i].id);
    return true;
  },

  tally: function(it, e){
    var yes = 0, no = 0;
    VOTERS.forEach(function(id){
      if (Meeting.lean(it, e, id) >= 0) yes++; else no++;
    });
    return { yes: yes, no: no, pass: yes >= (e.need || 5) };
  },

  word: function(v){
    return v >= 2 ? '明确赞成' : v > 0 ? '大体不反对'
      : v > -2 ? '有保留' : '明确反对';
  },

  /* 做工作：改某几个人的票 */
  work: function(uid, idx){
    var it = Desk.find(uid); if (!it || it.done) return;
    var e = EV(it.id); var a = e.acts[idx]; if (!a) return;
    if (!it.acted) it.acted = {};
    if (it.acted[idx]) return;
    var cost = costOf(a.d || 1) + (it.held ? 1 : 0);
    if (cost > G.days + 0.001){ UI.toast('这个月排不下了'); return; }
    if (a.req && !Desk.meet(a.req)) return;
    spendDays(cost);
    it.acted[idx] = 1;
    if (!it.eff) it.eff = {};
    for (var k in a.eff) it.eff[k] = (it.eff[k] || 0) + a.eff[k];
    if (a.fx) applyFx(a.fx);
    if (a.keep) keepAdd(a.keep);
    logAdd(e.title + '：' + a.t);
    save(); UI.render();
  }
};

/* ── 季度调度：每三个月一次常委会。
   那个季度主线自己有常委会，就不再另开 ── */
Meeting.gen = function(){
  if (G.month < 5) return;
  if (G.month % 3 !== 2) return;                   /* 每季度第二个月 */
  if (!G.cwCd) G.cwCd = {};
  /* 主线的常委会已经在队列或已排期里，这季度就不加了 */
  var hasArc = G.queue.some(function(q){
    var e = EV(q.id); return e && e.acts && !q.done;
  });
  if (hasArc) return;
  var pool = TOPICS.filter(function(t){
    if (G.month < t.mo[0] || G.month > t.mo[1]) return false;
    if (G.cwCd[t.id] && G.cwCd[t.id] > G.month) return false;
    return true;
  });
  if (!pool.length) return;
  var t = pool[ri(pool.length)];
  var id = 'cw_' + G.month + '_' + t.id;
  if (G.gen[id]) return;
  var e = {};
  for (var k in t) e[k] = t[k];
  e.id = id;
  e.kind = 'meeting';
  e.src = '常委会';
  e.due = 'month';
  G.gen[id] = e;
  G.cwCd[t.id] = G.month + (t.cd || 16);
  Desk.push(id, 'month');
};

/* === js/45-remark.js === */
/* ── 45-remark：月末书记批示 ──
   先看这个选项自己带的话（opt.rk），没有才落回通用档。
   空字符串是「他没批」，也是一种批示。 */
var Remark = {

  textOf: function(rk, tier){
    if (rk == null) return remarkOf(tier);
    if (typeof rk === 'string') return rk;
    if (rk[G.bossType] != null) return rk[G.bossType];
    return remarkOf(tier);
  },

  build: function(){
    var out = [];
    G.done.forEach(function(d){
      if (d.tier === 'none') return;
      out.push({ on: d.title, t: Remark.textOf(d.rk, d.tier || 'good') });
    });
    var missed = G.queue.filter(function(q){
      return !q.done && (q.due === 'month' || q.due === 'over');
    });
    if (missed.length){
      out.push({ on: missed[0].title, t: remarkOf('none') });
    }
    out = out.slice(0, 6);
    out.forEach(function(r){ G.archive.remarks.push({ m: G.month, on: r.on, t: r.t }); });
    return out;
  }
};

/* === js/50-events.js === */
/* ── 50-events：事件调度（once / cd / 权重 / 月份区间）────── */
var Events = {

  /* 这个月能不能抽到它 */
  ok: function(e){
    if (e.hidden || e.fixed || e.final) return false;
    if (e.once && G.seen[e.id]) return false;
    if (G.cool[e.id] && G.cool[e.id] > G.month) return false;
    if (e.mo && (G.month < e.mo[0] || G.month > e.mo[1])) return false;
    if (e.cm && e.cm.indexOf(ymOf(G.month).m) < 0) return false;   /* 只在某几个自然月出 */
    if (Desk.has(e.id)) return false;
    if (e.fam && G.hidden.famBroken) return false;
    if (e.orig && e.orig !== G.origin) return false;
    return true;
  },

  /* 月初把队列补到 4~6 件 */
  fill: function(){
    Pool.init();
    Pool.pushConflicts();
    Slots.gen();
    Arcs.tick();
    Talk.gen();
    Cut.gen();
    Meeting.gen();
    if (G.month === 1 && !G.seen.first_speech){
      G.queue.length = 0;
      Desk.push('first_speech', 'month');
      return;
    }
    /* 家庭压力满了，下月必出一件家里的事；
       就算一切都好，家里也不会连着三个月没动静 */
    var needFam = (G.hidden.fam >= 6) ||
                  (G.month >= 4 && G.month - (G.flags.famLastMo || 0) >= 3);
    if (needFam && !Desk.hasFam()){
      var fams = EVENTS.filter(function(e){ return e.fam && Events.ok(e); });
      if (fams.length) Desk.push(pick(fams).id, 'month');
    }
    var want = 4 + ri(3);
    var guard = 0;
    while (Desk.live() < want && guard++ < 60){
      var pool = EVENTS.filter(Events.ok);
      if (!pool.length) break;
      var total = 0, i;
      for (i = 0; i < pool.length; i++) total += (pool[i].w || 3);
      var r = rnd() * total, e = pool[pool.length - 1];
      for (i = 0; i < pool.length; i++){
        r -= (pool[i].w || 3);
        if (r <= 0){ e = pool[i]; break; }
      }
      Desk.push(e.id, rnd() < 0.62 ? 'month' : 'next');
    }
    if (Desk.hasFam()) G.flags.famLastMo = G.month;
  }
};

/* === js/60-arcs.js === */
/* ── 60-arcs：链条。一件事分几幕，幕与幕之间隔几个月。
   上一幕你怎么办的，决定下一幕是哪一幕 ── */
var Arcs = {

  def: function(id){
    return ARCS_BY_ID[id] || (G.genArc && G.genArc[id]) || null;
  },

  stageOf: function(arc, sid){
    for (var i = 0; i < arc.stages.length; i++) if (arc.stages[i].id === sid) return arc.stages[i];
    return null;
  },

  /* 把一幕做成一件真的待办 */
  push: function(arcId, sid, due, gap){
    var arc = Arcs.def(arcId); if (!arc) return null;
    var st = Arcs.stageOf(arc, sid); if (!st) return null;
    var id = 'arc_' + arcId + '_' + sid;
    if (G.gen[id] && G.seen[id]) return null;
    var e = {};
    for (var k in st) e[k] = st[k];
    e.id = id;
    e.kind = st.mats ? 'dossier' : 'note';
    e.src = st.src || '主线';
    e.arc = arcId;
    e.stage = sid;
    G.gen[id] = e;
    if (st.reveal) st.reveal.forEach(function(x){ Pool.reveal(x); });
    var it = Desk.push(id, due || 'month');
    if (it && due === 'plan') it.plan = gap || 2;
    return it;
  },

  /* 开一条线 */
  start: function(arcId){
    var arc = Arcs.def(arcId); if (!arc) return;
    if (G.arcs && G.arcs[arcId]) return;
    if (!G.arcs) G.arcs = {};
    G.arcs[arcId] = { at: G.month, stage: arc.stages[0].id };
    Arcs.push(arcId, arc.stages[0].id, 'month');
  },

  /* 这一幕办完了，看下一幕是哪一幕 */
  advance: function(e, idx, it){
    if (!e.arc) return;
    var arc = Arcs.def(e.arc); if (!arc) return;
    var st = Arcs.stageOf(arc, e.stage); if (!st || !st.next) return;
    var nid = (e.acts && it && it.tally)
      ? st.next[it.tally.pass ? 'pass' : 'fail']
      : st.next[idx];
    if (nid == null) nid = st.next['*'];
    if (!nid) {                                  /* 这条线到头了 */
      if (G.arcs && G.arcs[e.arc]) G.arcs[e.arc].done = G.month;
      return;
    }
    var ns = Arcs.stageOf(arc, nid);
    if (!ns) return;
    if (G.arcs && G.arcs[e.arc]) G.arcs[e.arc].stage = nid;
    var gap = ns.gap == null ? 2 : ns.gap;
    Arcs.push(e.arc, nid, gap > 0 ? 'plan' : 'month', gap);
  },

  /* 月初：到点的线自己开 */
  tick: function(){
    if (!G.arcs) G.arcs = {};
    ARCS.forEach(function(a){
      if (G.arcs[a.id]) return;
      if (!a.at) return;
      if (G.month < a.at[0] || G.month > a.at[1]) return;
      if (rnd() < 0.5 || G.month === a.at[1]) Arcs.start(a.id);
    });
  }
};

/* === js/70-endings.js === */
/* ── 70-endings：S1 只做判定壳和结局页，S6 补全文本 ───────── */
var ENDING_ORDER = ['rise','province','outpost','stay','cold','replaced',
                    'clear','report','together','self_out'];
var ENDINGS = ENDING_TEXT;

/* 图鉴：跨局存，记你打出过哪些 */
var DEX_KEY = 'dami_dex';
function dexGet(){
  try { return JSON.parse(localStorage.getItem(DEX_KEY) || '[]'); } catch (e){ return []; }
}
function dexAdd(k){
  try {
    var a = dexGet();
    if (a.indexOf(k) < 0){ a.push(k); localStorage.setItem(DEX_KEY, JSON.stringify(a)); }
  } catch (e){}
}

var Endings = {
  trigger: function(key){
    if (G.ending) return;
    G.ending = key;
    G.endAt = G.month;
    dexAdd(key);
    save();
  },
  /* 每月末检查一次 */
  tick: function(){
    if (G.ending) return;
    if (G.stats.trust < 30){
      G.flags.trustLow = (G.flags.trustLow || 0) + 1;
      if (G.flags.trustLow >= 3) Endings.trigger('replaced');
    } else {
      G.flags.trustLow = 0;
    }
    /* 干得好，他会被调走 */
    if (G.month >= 48 && !G.seen.boss_leave && !G.flags.bossGone &&
        G.stats.trust >= 58 && G.stats.prestige >= 48 && rnd() < 0.03){
      Desk.push('boss_leave', 'month');
    }
    /* 隐患太高，他自己先出事 */
    if (G.hidden.bossRisk >= 80 && !G.flags.bossOut && rnd() < 0.12){
      G.flags.bossOut = G.month;
      var red2 = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].red; });
      var hard2 = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].lv >= 4; });
      Endings.trigger((hard2 || G.flags.fought || (red2 && (G.archive.coop || 0) < 3)) ? 'together' : 'clear');
    }
  },
  /* 他要走了：你跟不跟得上 */
  bossLeave: function(){
    if (G.ending) return;
    G.flags.bossGone = G.month;
    var red = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].red; });
    var road = G.flags.bossRoad;
    /* 那天晚上你说了什么，基本就是后面三年 */
    if (road === 'follow') return Endings.trigger((G.stats.trust >= 62 && !red) ? 'rise' : 'cold');
    if (road === 'stay')   return Endings.trigger(G.stats.rep >= 58 ? 'stay' : 'cold');
    if (road === 'none')   return Endings.trigger(G.stats.guanxi >= 70 ? 'province' : 'cold');
    if (G.flags.followBoss && G.stats.trust >= 66 && !red) return Endings.trigger('rise');
    if (G.stats.guanxi >= 72 && G.stats.rep >= 60) return Endings.trigger('province');
    Endings.trigger(G.stats.rep >= 74 ? 'stay' : 'cold');
  },

  /* 巡视组反馈之后：前面所有的线在这里引爆或者排掉 */
  patrol: function(){
    if (G.ending) return;
    var red = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].red; });
    var hard = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].lv >= 4; });
    var coop = G.archive.coop || 0;
    var lead = G.hidden.lead, risk = G.hidden.bossRisk;
    G.flags.patrolDone = G.month;
    if (lead >= 70) return Endings.trigger('self_out');
    if (risk >= 70){
      /* 他倒了，你手上有没有红线的东西，这时候是唯一要紧的事。
         轻一点的那几条，如果这几年你次次都往上报过，还能摘得出来 */
      if (hard || G.flags.fought || (red && coop < 3)) return Endings.trigger('together');
      return Endings.trigger('clear');
    }
    if (red && coop === 0 && lead >= 45) return Endings.trigger('together');
    /* 没炸。剩下的日子接着过 */
  },

  /* 干满一届 */
  settle: function(){
    if (G.ending) return;
    var red = G.archive.fault.some(function(f){ return f.rule && RULES[f.rule] && RULES[f.rule].red; });
    if (G.flags.bossGone){
      return Endings.trigger(G.stats.rep >= 74 ? 'stay' : 'cold');
    }
    /* 你跟佟建民说过想去哪，那句话算数——前提是你真有那个本钱 */
    var road = G.flags.road;
    if (road === 'province' && G.stats.guanxi >= 52) return Endings.trigger('province');
    if (road === 'outpost' && G.stats.rep >= 55) return Endings.trigger('outpost');
    if (road === 'follow' && G.stats.trust >= 68 && !red) return Endings.trigger('rise');
    /* 什么也没说过的，就看这五年手里攒下的是什么。
       都不突出的那种人最多——机关里本来就是这样 */
    if (G.stats.trust >= 80 && !red) return Endings.trigger('rise');
    if (G.stats.guanxi >= 80 && G.stats.rep >= 60) return Endings.trigger('province');
    if (G.stats.rep >= 74) return Endings.trigger('outpost');
    Endings.trigger('stay');
  }
};

/* === js/95-install.js === */
/* ── 95-install：装到桌面 + 离线。跟玩法无关，放在最后 ──
   Chrome / Edge 能一点就装；Safari 没这个接口，只能给路径 */
(function(){
  if (typeof window === 'undefined' || typeof navigator === 'undefined') return;  /* 无头跑局时跳过 */
  var KEY = 'dami_install';
  var deferred = null, armed = false, reloading = false;
  var ua = navigator.userAgent;
  var isSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS/.test(ua);
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
                   navigator.standalone === true;

  function seen(){ try { return localStorage.getItem(KEY); } catch (e){ return null; } }
  function mark(v){ try { localStorage.setItem(KEY, v); } catch (e){} }

  function panel(html){
    var d = document.createElement('div');
    d.className = 'inst-mask';
    d.innerHTML = '<div class="inst-box">' + html + '</div>';
    document.body.appendChild(d);
    d.addEventListener('click', function(e){ if (e.target === d) close(d); });
    return d;
  }
  function close(d){ if (d && d.parentNode) d.parentNode.removeChild(d); }

  function offer(){
    if (standalone || document.querySelector('.inst-mask')) return;
    var body, box;
    if (deferred){
      body = '<h3>放一个到桌面</h3><p>装上之后不用开浏览器，断网也能接着办这个月的事。</p>' +
             '<div class="inst-row"><button class="inst-yes">装上</button>' +
             '<button class="inst-no">以后再说</button></div>';
    } else if (isIOS){
      body = '<h3>放一个到主屏幕</h3><p>点底部的分享按钮，往下找「添加到主屏幕」，右上角点添加。</p>' +
             '<div class="inst-row"><button class="inst-no">知道了</button></div>';
    } else if (isSafari){
      body = '<h3>放一个到程序坞</h3><p>菜单栏「文件」，往下找「添加到程序坞」。</p>' +
             '<div class="inst-row"><button class="inst-no">知道了</button></div>';
    } else { return; }
    box = panel(body);
    var yes = box.querySelector('.inst-yes'), no = box.querySelector('.inst-no');
    if (yes) yes.onclick = function(){ close(box); doInstall(); };
    if (no) no.onclick = function(){ mark('dismissed'); close(box); };
  }

  function doInstall(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(r){
      mark(r && r.outcome === 'accepted' ? 'installed' : 'dismissed');
      deferred = null;
    });
  }

  /* 界面出来之后再等四十五秒。一进来就弹很烦 */
  function arm(){
    if (armed || standalone) return;
    var st = seen();
    if (st === 'dismissed' || st === 'installed') return;
    armed = true;
    var t = setInterval(function(){
      if (document.querySelector('.tabs')){ clearInterval(t); setTimeout(offer, 45000); }
    }, 2000);
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; arm();
  });
  if (isSafari || isIOS) window.addEventListener('load', arm);
  window.addEventListener('appinstalled', function(){ mark('installed'); });

  /* 设置里常驻一个入口 */
  window.installOffer = function(){
    if (standalone){ if (window.UI && UI.toast) UI.toast('已经装好了'); return; }
    mark(''); offer();
  };

  /* 离线 */
  if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            if (nw.state === 'installed' && navigator.serviceWorker.controller){
              var box = panel('<h3>有新版本</h3><p>刷新之后是新的。这一局的存档不会丢。</p>' +
                '<div class="inst-row"><button class="inst-yes">刷新</button>' +
                '<button class="inst-no">待会儿</button></div>');
              box.querySelector('.inst-yes').onclick = function(){
                if (reg.waiting) reg.waiting.postMessage('skipWaiting');
                close(box);
              };
              box.querySelector('.inst-no').onclick = function(){ close(box); };
            }
          });
        });
      }).catch(function(){});
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }
})();

if (typeof BOOT === "function") BOOT();
</script>
